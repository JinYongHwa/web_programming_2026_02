<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <input type="text" id="email" class="form-control" placeholder="이메일">
        <input type="password" id="password" class="form-control" placeholder="비밀번호">
        <div class="text-center">
            <button class="btn btn-primary" id="login">로그인</button>
        </div>
    </div>
    <script>
        var loginBtn=document.getElementById("login")   //로그인버튼
        loginBtn.addEventListener("click",function(){
            //로그인 버튼 클릭시
            var email=document.getElementById("email").value
            var password=document.getElementById("password").value
            fetch("/api/user/login",{
                method:"post",
                headers:{
                    "content-type":"application/json"
                },
                body:JSON.stringify({
                    email:email,
                    password:password
                })
            })
                .then(response=>{
                    return response.json()
                })
                .then(userResponse=>{
                    if(userResponse.success){   //로그인 성공시
                        alert("로그인 완료")
                        location.href="/"
                    }
                    else{
                        alert(userResponse.message)
                    }
                })
        })
    </script>

</body>
</html>
