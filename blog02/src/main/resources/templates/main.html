<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .article{
            padding:8px 16px;
            border-bottom:1px solid #eee;
            text-decoration: none;
            display:block;
        }
        .article:hover{
            cursor:pointer;
            background:#eee;
        }
        .article .title{
            font-size:16px;
            font-weight:700;
            color:black;
        }
        .article .date{
            text-align:right;
            color:#999;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인이 안되있을때        -->
        <div th:if="${user} == null">
            <a href="/login" class="btn btn-primary">로그인</a>
        </div>
        <!-- 로그인이 되어있을때        -->
        <div th:if="${user} != null">
            <div th:text="${user.name}"></div>
            <a href="/logout" class="btn btn-primary">로그아웃</a>
        </div>

        <div class="text-right">
            <a href="/write" class="btn btn-primary">글쓰기</a>
        </div>
        <a th:href="@{/view/{no}(no=${article.no})}" class="article" th:each="article : ${list}">
            <div class="title" th:text="${article.title}">글제목</div>
            <div class="date" th:text="${article.writeDate}">글작성시간</div>
            <div th:if="${article.writer} != null">
                작성자 : <span th:text="${article.writer.name}"></span>
            </div>
        </a>
    </div>
</body>
</html>
