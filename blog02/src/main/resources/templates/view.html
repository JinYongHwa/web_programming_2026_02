<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        h1{
            padding:10px;
            border-bottom: 1px solid #eee;
        }
        .date{
            text-align:right;
            color:#999;
        }
        p{
            background:#eee;
            min-height:500px;
            padding:16px;
            border-radius: 12px;
            margin-top:16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${article.title}"></h1>
        <div class="date" th:text="${article.writeDate}"></div>
        <p th:text="${article.body}"></p>
        <div class="text-center mt-4">
            <a class="btn btn-primary" href="/">목록</a>
            <button class="btn btn-danger" id="delete">삭제</button>
            <a th:href="@{'/modify/'+${article.no} }" class="btn btn-primary">수정</a>

        </div>
        <input type="hidden" th:value="${article.no}" id="no">
    </div>
    <script>
        var no=document.getElementById("no").value
        var deleteBtn=document.getElementById("delete")     //삭제버튼
        deleteBtn.addEventListener("click",function(){
            //삭제버튼 클릭시
            fetch("/api/article/"+no,{
                method:"delete",
                headers:{
                    "content-type":"application/json"
                }
            })
                .then(function(response){
                    return response.json()
                })
                .then(function(json){
                    if(json.success){   //삭제 성공시
                        alert("글이 삭제되었습니다")
                        location.href="/"
                    }
                    else{   //삭제 실패시
                        alert(json.message)
                    }
                })

        })
    </script>
</body>
</html>
